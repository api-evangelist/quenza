name: Quenza
kind: company
description: >-
  Quenza is a digital care and client-engagement platform for coaches,
  therapists, and other helping professionals. Practitioners build activities -
  worksheets, exercises, psycho-education, intake forms, reflection prompts, and
  surveys - bundle them into timed pathways (care programs), and share them with
  clients through a branded client portal and mobile apps, then track responses,
  results, notes, tasks, and chat. Quenza exposes a documented public REST API
  (v1) for programmatically managing clients, team members, groups, and tasks,
  authenticated with a workspace Bearer token. API access is available on the
  Collective and Beyond plans; webhooks are available from the Growth plan up.
