meters:
- name: subscription_tier
  description: The selected Quenza plan (Spark, Growth, Impact, Collective, Beyond), billed flat per month or year.
  unit: subscription
  aggregation: max
  dimensions:
  - account
  - plan
- name: client_capacity
  description: Number of clients allowed by the tier (10 / 250 / 400 / 500 / unlimited); a capacity limit rather than a billed unit.
  unit: clients
  aggregation: max
  dimensions:
  - account
  - plan
- name: professional_seats
  description: Number of professional seats included by the tier (1 / 1 / 1 / 3 / unlimited).
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: webhook_capacity
  description: Number of outbound webhooks allowed by the tier (0 / 1 / 2 / 5 / unlimited).
  unit: webhooks
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track which tier each workspace is on and whether its client/seat/webhook capacity is actually being used, so you are not paying for a higher tier than needed.
- name: Allocation
  description: Map each Quenza workspace/subscription to the practice, team, or program that owns it.
- name: Optimization
  description: Choose annual billing for the discounted effective monthly rate; right-size the tier to real client and seat counts; only step up to Collective/Beyond when API access or added capacity is genuinely required.
- name: Accountability
  description: Assign an owner per workspace and review the tier against actual client, seat, and API/webhook usage at each renewal.
