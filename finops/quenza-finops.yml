description: >-
  FinOps view of Quenza spend. Quenza is a per-workspace SaaS subscription billed
  monthly or annually across five tiers (Spark, Growth, Impact, Collective,
  Beyond). Cost is driven by the tier you select, which scales by number of
  clients, number of professional seats, activity library size, and features
  such as webhooks and API access. The v1 REST API carries no separate metered
  fee - it is unlocked as a feature on the Collective and Beyond tiers, so the
  cost of "using the API" is simply the subscription tier that includes it.
  Annual billing lowers the effective monthly rate. There is no usage-metered or
  per-call pricing dimension.
notes: >-
  Per-tier prices and limits were read from the Quenza pricing page and may
  change; verify at https://quenza.com/pricing/ during reconciliation. Beyond is
  custom-priced. Because pricing is flat-per-tier rather than usage-metered, the
  meters below track subscription and seat/client capacity rather than API call
  volume.
