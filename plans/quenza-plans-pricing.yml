description: >-
  Quenza is sold as a tiered per-workspace SaaS subscription, billed monthly or
  annually (annual is discounted). Tiers scale by number of clients, number of
  professionals (seats), activity library size, and platform features. The
  public REST API (v1) is a plan-gated feature - it is included on the
  Collective and Beyond tiers, not on Spark, Growth, or Impact. Outbound
  webhooks are available from Growth up (1 webhook on Growth, 2 on Impact, 5 on
  Collective, unlimited on Beyond). All plans include a 30-day free trial with
  no credit card required. Prices below are per workspace, in USD; annual prices
  are the discounted effective monthly rate when billed yearly.
notes: >-
  Prices and limits were read from the Quenza pricing page and may change;
  verify current tiers, client/seat limits, and API/webhook availability at
  https://quenza.com/pricing/ during reconciliation. The API itself carries no
  separate fee beyond the subscription tier that unlocks it.
sources:
- https://quenza.com/pricing/
- https://developers.quenza.com/docs/v1
