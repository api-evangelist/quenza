apis:
- aid: quenza:quenza-clients-api
  name: Quenza Clients API
  tags:
  - Clients
  - Practice Management
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.quenza.com/docs/v1
  baseURL: https://developers.quenza.com/v1
  properties:
  - url: https://developers.quenza.com/docs/v1
    type: Documentation
  - url: https://developers.quenza.com/docs/v1
    type: APIReference
  - url: openapi/quenza-openapi.yml
    type: OpenAPI
  description: >-
    Programmatically manage the people a practitioner works with. List and
    retrieve clients (paginated), create a client and send them an invitation
    email, update client fields, and archive or unarchive a client - archiving
    cancels active assignments and makes their chats read-only. Confirmed
    endpoints - GET/POST /clients, GET/PATCH /clients/{client}, and POST
    /clients/{client}/archive and /unarchive.
- aid: quenza:quenza-groups-api
  name: Quenza Groups API
  tags:
  - Groups
  - Clients
  - Membership
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.quenza.com/docs/v1
  baseURL: https://developers.quenza.com/v1
  properties:
  - url: https://developers.quenza.com/docs/v1
    type: Documentation
  - url: https://developers.quenza.com/docs/v1
    type: APIReference
  - url: openapi/quenza-openapi.yml
    type: OpenAPI
  description: >-
    Organize clients into groups for shared programs and communication. Create a
    group and attach members to it. Confirmed endpoints - POST /groups and POST
    /groups/{group}/members.
- aid: quenza:quenza-members-api
  name: Quenza Members API
  tags:
  - Members
  - Professionals
  - Team
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.quenza.com/docs/v1
  baseURL: https://developers.quenza.com/v1
  properties:
  - url: https://developers.quenza.com/docs/v1
    type: Documentation
  - url: https://developers.quenza.com/docs/v1
    type: APIReference
  - url: openapi/quenza-openapi.yml
    type: OpenAPI
  description: >-
    Manage the team members (professionals) in a workspace. List all members
    including pending and suspended ones, invite a new member with a member or
    manager role, and update member fields. Confirmed endpoints - GET/POST
    /members and PATCH /members/{professional}.
- aid: quenza:quenza-tasks-api
  name: Quenza Tasks API
  tags:
  - Tasks
  - Assignments
  - Workflow
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.quenza.com/docs/v1
  baseURL: https://developers.quenza.com/v1
  properties:
  - url: https://developers.quenza.com/docs/v1
    type: Documentation
  - url: https://developers.quenza.com/docs/v1
    type: APIReference
  - url: openapi/quenza-openapi.yml
    type: OpenAPI
  description: >-
    List the tasks in a workspace (paginated), optionally filtered by assignee
    using assignee_type and assignee_id together. Confirmed endpoint - GET
    /tasks.
