openapi: 3.1.0
info:
  title: Quenza ArchiveClient Clients API
  version: 1.0.0
  description: The Quenza API allows you to integrate your systems with Quenza — manage clients, sync data, and automate workflows. Authenticate using a Bearer token from your workspace settings under Developer Tools → API Token.
servers:
- url: https://developers.quenza.com/v1
security:
- http: []
tags:
- name: Clients
paths:
  /clients:
    get:
      operationId: developers.v1.clients.list
      description: Returns a paginated list of all clients in the workspace.
      summary: List clients
      tags:
      - Clients
      parameters:
      - name: offset
        in: query
        description: Number of items to skip.
        schema:
          type: integer
          default: 0
        example: 0
      - name: limit
        in: query
        description: 'Number of items to return per request. Max: 100.'
        schema:
          type: integer
          default: 20
        example: 20
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientResource'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
                    required:
                    - limit
                    - offset
                    - total
                  links:
                    type: object
                    properties:
                      next:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                    required:
                    - next
                    - prev
                required:
                - data
                - meta
                - links
        '401':
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: developers.v1.clients.create
      description: Creates a new client and sends them an invitation email.
      summary: Create a client
      tags:
      - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: '`ClientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClientResource'
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /clients/{client}:
    get:
      operationId: developers.v1.clients.show
      description: Returns a single client by their ID.
      summary: Get a client
      tags:
      - Clients
      parameters:
      - name: client
        in: path
        required: true
        description: The client sqid
        schema:
          type: integer
      responses:
        '200':
          description: '`ClientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClientResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
    patch:
      operationId: developers.v1.clients.update
      description: Updates one or more fields on an existing client. Only the fields included in the request body are updated.
      summary: Update a client
      tags:
      - Clients
      parameters:
      - name: client
        in: path
        required: true
        description: The client sqid
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: '`ClientResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClientResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /clients/{client}/archive:
    post:
      operationId: developers.v1.clients.archive
      description: Archives a client, cancels all active assignments, and makes their chats read-only.
      summary: Archive a client
      tags:
      - Clients
      parameters:
      - name: client
        in: path
        required: true
        description: The client sqid
        schema:
          type: integer
      responses:
        '200':
          description: ''
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
  /clients/{client}/unarchive:
    post:
      operationId: developers.v1.clients.unarchive
      description: Restores an archived client to active status and re-enables their chats.
      summary: Unarchive a client
      tags:
      - Clients
      parameters:
      - name: client
        in: path
        required: true
        description: The client sqid
        schema:
          type: integer
      responses:
        '200':
          description: ''
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
